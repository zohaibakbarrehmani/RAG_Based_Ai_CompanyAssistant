<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect x="1" y="1" width="30" height="30" rx="7.5" fill="url(#brandGrad)" stroke="url(#strokeGrad)" stroke-width="1" />
  
  <!-- AI Radiance / Neural Rays -->
  <g stroke="#ffffff" stroke-width="1.8" stroke-linecap="round">
    <!-- Orthogonal rays -->
    <line x1="16" y1="6.5" x2="16" y2="9.5" />
    <line x1="16" y1="22.5" x2="16" y2="25.5" />
    <line x1="6.5" y1="16" x2="9.5" y2="16" />
    <line x1="22.5" y1="16" x2="25.5" y2="16" />
    
    <!-- Diagonal rays -->
    <line x1="9.3" y1="9.3" x2="11.4" y2="11.4" />
    <line x1="20.6" y1="20.6" x2="22.7" y2="22.7" />
    <line x1="22.7" y1="9.3" x2="20.6" y2="11.4" />
    <line x1="11.4" y1="20.6" x2="9.3" y2="22.7" />
  </g>
  
  <!-- Central Core Ring & Bright Center Dot -->
  <circle cx="16" cy="16" r="4.2" stroke="#ffffff" stroke-width="1.8" fill="#ffffff" fill-opacity="0.2" />
  <circle cx="16" cy="16" r="1.7" fill="#ffffff" />
</svg>
